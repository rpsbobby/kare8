apiVersion: v1
kind: Service
metadata:
  name: invoice-service
spec:
  type: NodePort
  selector:
    app: invoice-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30082
    - name: metrics
      port: 9000
      targetPort: 9000
      nodePort: 30092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoice-service
spec:
  selector:
    matchLabels:
      app: invoice-service
  template:
    metadata:
      labels:
        app: invoice-service
    spec:
      containers:
        - name: invoice-service
          image: ghcr.io/rpsbobby/kare8-invoice_service:develop
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: localhost:29092
