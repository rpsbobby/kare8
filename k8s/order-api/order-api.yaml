---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  namespace: kare8
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-api
  template:
    metadata:
      labels:
        app: order-api
    spec:
      containers:
        - name: order-api
          image: ghcr.io/rpsbobby/kare8-order_api:develop
          ports:
            - name: http
              containerPort: 8000
            - name: metrics
              containerPort: 9000
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: host.docker.internal:29092
---
apiVersion: v1
kind: Service
metadata:
  name: order-api
  namespace: kare8
spec:
  type: ClusterIP   # ✅ internal only, ingress will front it
  selector:
    app: order-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
    - name: metrics
      port: 9000
      targetPort: 9000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: order-api-ingress
  namespace: kare8
spec:
  ingressClassName: nginx
  rules:
    - host: kare8.local
      http:
        paths:
          - path: /order
            pathType: Prefix
            backend:
              service:
                name: order-api
                port:
                  number: 8000
