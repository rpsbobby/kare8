apiVersion: v1
kind: Service
metadata:
  name: email-service
spec:
  type: NodePort
  selector:
    app: email-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30083
    - name: metrics
      port: 9000
      targetPort: 9000
      nodePort: 30093
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-service
spec:
  selector:
    matchLabels:
      app: email-service
  template:
    metadata:
      labels:
        app: email-service
    spec:
      containers:
        - name: email-service
          image: ghcr.io/rpsbobby/kare8-email_service:${IMAGE_TAG:-develop}
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: host.docker.internal:29092
