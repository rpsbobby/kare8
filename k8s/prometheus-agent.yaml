apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-agent
  namespace: kare8
  labels:
    app: prometheus-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-agent
  template:
    metadata:
      labels:
        app: prometheus-agent
    spec:
      serviceAccountName: prometheus-agent
#      hostAliases:
#        - ip: "192.168.65.1"   # Docker Desktop host-gateway
#          hostnames:
#            - "host.docker.internal"
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--enable-feature=agent"   # agent mode
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/
      volumes:
        - name: config
          configMap:
            name: prometheus-agent-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-agent-config
  namespace: kare8
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: 'kare8-services'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: order-api|kafka-consumer|invoice-service|email-service
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "9000"
          - source_labels: [__meta_kubernetes_pod_ip,__meta_kubernetes_pod_container_port_number]
            action: replace
            regex: (.+);(.+)
            replacement: ${1}:${2}
            target_label: __address__

    remote_write:
      - url: "http://host.docker.internal:9090/api/v1/write"
    
