events {}

http {
    upstream order_api {
        server host.docker.internal:30080;  # order-api NodePort
    }

    upstream consumer {
        server host.docker.internal:30081;  # consumer NodePort
    }

    upstream invoice {
        server host.docker.internal:30082;  # invoice-service NodePort
    }

    upstream email {
        server host.docker.internal:30083;  # email-service NodePort
    }

    server {
        listen 80;

        location /order {
            proxy_pass http://order_api;
        }

        location /consumer {
            proxy_pass http://consumer;
        }

        location /invoice {
            proxy_pass http://invoice;
        }

        location /email {
            proxy_pass http://email;
        }
    }
}
